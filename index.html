<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Oopsation</title>

<!-- CSS Link -->
<link rel="stylesheet" href="style.css">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="overlay"></div>

<!-- LOGIN -->
<div class="screen" id="loginScreen">
    <img src="https://cdn-icons-png.flaticon.com/512/201/201571.png" class="logo">
    <h1>Quiz Oopsation</h1>
    <input type="text" id="usernameInput" placeholder="Enter Name">
    <button onclick="login()">Start Quiz</button>
</div>

<!-- HOME -->
<div class="screen hide" id="homeScreen">
    <h2>Welcome, <span id="usernameDisplay"></span> 👋</h2>
    <p class="sub">Choose Category</p>

    <button onclick="startQuiz('maths')">📘 Maths</button>
    <button onclick="startQuiz('gk')">🌍 GK</button>
    <button onclick="startQuiz('cricket')">🏏 Cricket</button>
</div>

<!-- QUIZ -->
<div class="screen hide" id="quizScreen">
    <h2 id="quizTitle"></h2>
    <h3 id="questionText"></h3>
    <div id="optionsBox"></div>
    <button class="next-btn" onclick="nextQuestion()">Next ➤</button>
</div>

<!-- RESULT -->
<div class="screen hide" id="resultScreen">
    <h1>Completed🎉</h1>
    <h2>Your Score: <span id="finalScore"></span></h2>
    <button onclick="goHome()">Go Home</button>
</div>

<!-- JS Link -->
<script src="script.js"></script>
</body>
</html>
